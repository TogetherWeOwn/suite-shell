name: gitleaks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history with the default policy
        run: |
          set -euo pipefail
          policy="$(mktemp -d "$RUNNER_TEMP/gitleaks-policy.XXXXXX")"
          printf '[extend]\nuseDefault = true\n' > "$policy/gitleaks.toml"
          # The suite has no custom rules or ignores. Prevent the scanned
          # checkout from supplying an implicit ignore file.
          if [[ -e .gitleaksignore || -L .gitleaksignore ]]; then
            echo 'This repository does not use a .gitleaksignore file.' >&2
            exit 1
          fi
          : > "$policy/ignore"
          "$RUNNER_TEMP/gitleaks" git . --redact --exit-code 1 \
            --log-opts='--text --diff-merges=first-parent HEAD' --ignore-gitleaks-allow \
            --config "$policy/gitleaks.toml" --gitleaks-ignore-path "$policy/ignore"
