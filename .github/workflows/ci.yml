name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tgz"
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build and verify the checked-in distribution
        run: |
          set -euo pipefail
          npm run build
          if [[ -n "$(git status --porcelain -- dist)" ]]; then
            git status --short -- dist
            echo 'Run npm run build and commit the updated dist directory.' >&2
            exit 1
          fi
      - name: Install the Git package without lifecycle scripts
        run: |
          set -euo pipefail
          consumer="$(mktemp -d "$RUNNER_TEMP/suite-shell-consumer.XXXXXX")"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund \
            "git+file://${GITHUB_WORKSPACE}#${GITHUB_SHA}"
          for file in index.js index.d.ts styles.css tokens.css; do
            test -s "$consumer/node_modules/suite-shell/dist/$file"
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium for accessibility and UI tests
        run: npm exec -- playwright install --with-deps chromium
      - name: Test package exports in Chromium and run unit tests
        run: npm test
