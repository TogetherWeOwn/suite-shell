name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tgz"
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      # Only the initial CI-only tree has no npm project. Any new tracked
      # path makes the exception fail closed; the package PR removes it.
      - name: Verify CI-only bootstrap tree
        if: hashFiles('package.json') == ''
        run: |
          set -euo pipefail
          git ls-files -z | node -e '
            const actual = require("node:fs").readFileSync(0, "utf8").split("\0").filter(Boolean);
            const bootstrap = [".github/workflows/ci.yml", ".github/workflows/gitleaks.yml", "LICENSE", "README.md"];
            if (JSON.stringify(actual) !== JSON.stringify(bootstrap)) {
              console.error("Expected the CI-only bootstrap tree; a new path requires package.json and all package checks.");
              process.exitCode = 1;
            }
          '
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package.json') != ''
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install, lint, typecheck, test and build
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npm test
          npm run build
